version: '3.8'
services:
    fill-demo-data:
        build:
            # Context is the parent (application/) so the image can COPY both
            # server/ and the pre-built client/dist — the Dockerfile lives in server/.
            context: ..
            dockerfile: server/dockerfile
        # package.json lives at /app/server (the image keeps the repo's
        # server/ + client/ nesting), so npm must run from there.
        working_dir: /app/server
        entrypoint: 'npm'
        command: 'run fill-demo-data'
        environment:
            - MONGODB_CONNECTION_STRING=mongodb+srv://woofi:${MONGODB_PASSWORD}@portfolio.lorxr25.mongodb.net/portfolio
    web:
        build:
            context: ..
            dockerfile: server/dockerfile
        environment:
            - MONGODB_CONNECTION_STRING=mongodb+srv://woofi:${MONGODB_PASSWORD}@portfolio.lorxr25.mongodb.net/portfolio
            - JWT_SECRET=${JWT_SECRET}
            - JWT_EXPIRES_IN=1h
            - ADMIN_USER=${ADMIN_USER}
            - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH}
        ports:
            - '8080:8080'
        healthcheck:
            test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:8080/api/live']
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 40s
        depends_on:
            fill-demo-data:
                condition: service_completed_successfully
    mongodb:
        image: mongo:latest
        container_name: portfolio-database
        restart: always
        attach: false
        environment:
            MONGO_INITDB_DATABASE: portfolio
        healthcheck:
            test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
        ports:
            - 27017:27017
