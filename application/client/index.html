        <!--
          `:root` in index.css defines the LIGHT palette as the unqualified default
          (`--bg: #eef2f9`, applied to <body> unconditionally), and the theme class
          that flips it to dark only gets set by DefaultLayout's useLayoutEffect —
          which can't run until the module bundle has been fetched, parsed and
          React has mounted. The browser paints the light background the moment
          CSS is ready, well before that, so a dark-preferring visitor saw a flash
          of light background on every load. This blocking, non-module script
          mirrors DefaultLayout's theme resolution (see default-layout.jsx) and
          runs before the stylesheet can paint anything, so `.dark` is already on
          <html> at first paint. Kept in sync by hand, not shared code — a
          blocking head script and the React bundle can't import from each other.
        -->
        <script>
            (function () {
                try {
                    var theme = localStorage.getItem('theme') || 'system';
                    var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                    var isDark = theme === 'dark' || (theme === 'system' && systemDark);
                    document.documentElement.classList.toggle('dark', isDark);
                } catch (e) {
                    // Storage blocked (private browsing, disabled cookies, etc.) — fall
                    // back to system preference so the page still themes correctly.
                    document.documentElement.classList.toggle(
                        'dark',
                        window.matchMedia('(prefers-color-scheme: dark)').matches,
                    );
                }
            })();
        </script>
