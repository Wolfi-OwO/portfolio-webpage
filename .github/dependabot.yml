# Dependabot, tuned for silence rather than immediacy.
#
# It used to run weekly across four ecosystems with a per-ecosystem PR limit of
# 5, which meant a fresh pull request — and a fresh email — most Mondays. The
# updates were worth having; the mail was not.
#
# Three knobs do the quieting, and they compound:
#   interval: monthly          one wake-up a month, not four
#   groups with patterns "*"   every bump in an ecosystem lands in ONE PR
#   open-pull-requests-limit   at most one PR open per ecosystem at a time
#
# Net effect: at most four PRs a month, usually one or two, instead of a weekly
# drip. Major versions stay ignored — those are a decision, not a chore.

version: 2
updates:
  # The glob covers server/ and client/ too — both were previously unmonitored.
  - package-ecosystem: npm
    directories:
      - /application
      - /application/*
    schedule:
      interval: monthly
      day: monday
      time: "06:00"
      timezone: Europe/Vienna
    open-pull-requests-limit: 1
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
    groups:
      # One PR for the whole ecosystem, not one per package.
      application:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    labels:
      - ci
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  - package-ecosystem: docker
    directory: /application
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    labels:
      - docker
    commit-message:
      prefix: chore
    groups:
      docker:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
