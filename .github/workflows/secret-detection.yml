name: Secret Detection

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    name: TruffleHog
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          # TruffleHog diffs the pushed commits; without the full history it has
          # no base to compare against.
          fetch-depth: 0

      # Pinned to a release rather than @main: a secret scanner is the last place
      # you want an unreviewed upstream change to run against your repository.
      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@v3.95.9
        with:
          extra_args: --results=verified,unknown
