name: Release Deploy

# Publishing a GitHub Release builds the image, pushes it to Azure Container
# Registry and rolls the Azure Container App onto the new tag.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to build and deploy (defaults to the git ref name)'
        required: false

permissions:
  contents: read
  id-token: write   # required for Azure OIDC login

jobs:
  deploy:
    name: Build, push & deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/client/package-lock.json

      - name: Build client bundle
        working-directory: app/client
        run: |
          npm ci
          npm run build

      - name: Resolve image coordinates
        id: img
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          IMAGE="${{ vars.ACR_NAME }}.azurecr.io/${{ vars.IMAGE_NAME }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "Building ${IMAGE}:${TAG}"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: az acr login --name ${{ vars.ACR_NAME }}

      - name: Build and push image
        working-directory: app
        run: |
          docker build -f dockerfile \
            -t "${{ steps.img.outputs.image }}:${{ steps.img.outputs.tag }}" \
            -t "${{ steps.img.outputs.image }}:latest" \
            .
          docker push "${{ steps.img.outputs.image }}:${{ steps.img.outputs.tag }}"
          docker push "${{ steps.img.outputs.image }}:latest"

      - name: Deploy to Azure Container App
        run: |
          az containerapp update \
            --name "${{ vars.CONTAINERAPP_NAME }}" \
            --resource-group "${{ vars.RESOURCE_GROUP }}" \
            --image "${{ steps.img.outputs.image }}:${{ steps.img.outputs.tag }}"

      - name: Show deployed revision
        run: |
          az containerapp revision list \
            --name "${{ vars.CONTAINERAPP_NAME }}" \
            --resource-group "${{ vars.RESOURCE_GROUP }}" \
            --query "[0].{revision:name, active:properties.active, image:properties.template.containers[0].image}" \
            -o table
