name: Release Deploy

# Publishing a GitHub Release builds the client, pushes the image to Azure
# Container Registry and rolls the Azure Container App onto the new tag.
#
# Jobs are split so the parts that don't need an Azure identity (metadata
# resolution, client build, the ACR push using scoped registry tokens) can
# run freely. Only the final containerapp rollout needs an Azure AD identity
# (rolling a revision is an ARM call, not a registry operation, so the ACR
# tokens used to push the image can't authorize it) and therefore the
# `production` environment. Keeping that one call in its own job means a
# release only ever waits on a single reviewer approval.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to build and deploy (defaults to the git ref name)'
        required: false

permissions:
  contents: write # sync-version commits the bumped package.json files back
  id-token: write # required for Azure OIDC login in deploy-to-production

jobs:
  resolve-metadata:
    name: Resolve image metadata
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      image: ${{ steps.meta.outputs.image }}
      build_date: ${{ steps.meta.outputs.build_date }}
      revision_suffix: ${{ steps.meta.outputs.revision_suffix }}
    steps:
      - name: Compute tag, image, build date & revision suffix
        id: meta
        run: |
          TAG="${{ github.event.inputs.tag || github.event.release.tag_name || github.ref_name }}"
          if [ -z "$TAG" ]; then
            echo "::error::Could not resolve an image tag from the triggering event."
            exit 1
          fi
          IMAGE="${{ vars.ACR_NAME }}.azurecr.io/${{ vars.IMAGE_NAME }}"

          # Name the revision after the version it runs, so `revision list` reads
          # `portfolio-app--v6-0-1` instead of an opaque `portfolio-app--0000022`.
          # A suffix may only hold lowercase alphanumerics and dashes, so the dots
          # in a semver tag have to go, and any run of separators collapses to one.
          SUFFIX=$(echo "$TAG" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's/[^a-z0-9]\+/-/g; s/^-\+//; s/-\+$//')
          if [ -z "$SUFFIX" ]; then
            echo "::error::Tag '${TAG}' normalises to an empty revision suffix."
            exit 1
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "revision_suffix=${SUFFIX}" >> "$GITHUB_OUTPUT"
          echo "Resolved ${IMAGE}:${TAG} (revision suffix: ${SUFFIX})"

  sync-version:
    name: Sync package versions to the tag
    runs-on: ubuntu-latest
    needs: resolve-metadata
    steps:
      - uses: actions/checkout@v4
        with:
          # The release tag points at a commit, not a branch. Check out the branch
          # so the version bump has somewhere to land.
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: application/package-lock.json

      # The git tag is the single source of truth for "which version is this?".
      # Rather than bumping four package.json files by hand (and forgetting one),
      # the tag is stamped into all of them, lockfiles included.
      - name: Stamp the version into every package.json
        working-directory: application
        run: npm run version:sync -- "${{ needs.resolve-metadata.outputs.tag }}"

      # Authored as the repo owner, not github-actions[bot]. The bump is a
      # mechanical consequence of a release *he* published, and attributing it to
      # a bot puts github-actions[bot] in the repository's contributor list for
      # what is really his commit. The noreply address is the one GitHub issues
      # for this account, so the commit still links to it without exposing a
      # private email.
      - name: Commit the bump
        run: |
          if git diff --quiet; then
            echo "Versions already match ${{ needs.resolve-metadata.outputs.tag }} — nothing to commit."
            exit 0
          fi
          git config user.name "Wolfi-OwO"
          git config user.email "121342560+Wolfi-OwO@users.noreply.github.com"
          git add application/package.json application/*/package.json application/package-lock.json application/jobs/package-lock.json
          git commit -m "chore(release): set version to ${{ needs.resolve-metadata.outputs.tag }}"
          git push

  build-client:
    name: Build client bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: application/package-lock.json

      - name: Build client bundle
        working-directory: application
        run: |
          npm ci
          npm run build

      - name: Upload client bundle
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: application/client/dist
          retention-days: 1

  push-image:
    name: Push image to ACR
    runs-on: ubuntu-latest
    needs: [resolve-metadata, build-client]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: application/package-lock.json

      # sync-version pushes its bump to the default branch, but this job builds
      # from the *tag*, whose tree was written before that commit existed — so the
      # tag still carries the previous version. Stamp it again here, into the build
      # context only (never committed), so the package.json baked into the image
      # agrees with the tag the image is published under. Without this the image's
      # own metadata reports the previous release.
      - name: Stamp the version into the build context
        working-directory: application
        run: npm run version:sync -- "${{ needs.resolve-metadata.outputs.tag }}"

      - name: Download client bundle
        uses: actions/download-artifact@v8
        with:
          name: client-dist
          path: application/client/dist

      # Scoped ACR token (push/pull only, revocable) — no Azure AD identity
      # or OIDC login needed for this job.
      - name: Log in to ACR
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.ACR_NAME }}.azurecr.io
          username: ${{ secrets.ACR_PUSH_USERNAME }}
          password: ${{ secrets.ACR_PUSH_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: application
          file: application/dockerfile
          push: true
          # Push a plain single-platform image manifest, not an OCI index.
          #
          # By default Buildx attaches provenance/SBOM attestations, which turns
          # the push into an index whose children (the real payload and the
          # attestations) carry no tags of their own. An ACR cleanup that deletes
          # "untagged" manifests then reaps those children while leaving the
          # tagged index behind — the tag still resolves, but every pull fails
          # with MANIFEST_UNKNOWN. That is what took production down and it
          # destroyed every tag in the repository, so there was nothing to roll
          # back to. A single manifest has no untagged children to lose.
          provenance: false
          sbom: false
          tags: |
            ${{ needs.resolve-metadata.outputs.image }}:${{ needs.resolve-metadata.outputs.tag }}
            ${{ needs.resolve-metadata.outputs.image }}:latest
          build-args: |
            APP_VERSION=${{ needs.resolve-metadata.outputs.tag }}
            BUILD_DATE=${{ needs.resolve-metadata.outputs.build_date }}
            VCS_REF=${{ github.sha }}
            APP_SOURCE=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-production:
    name: Deploy to Azure Container App
    runs-on: ubuntu-latest
    needs: [resolve-metadata, push-image]
    environment: production
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Container App
        run: |
          #
          az containerapp update \
            --name "${{ vars.CONTAINERAPP_NAME }}" \
            --resource-group "${{ vars.RESOURCE_GROUP }}" \
            --image "${{ needs.resolve-metadata.outputs.image }}:${{ needs.resolve-metadata.outputs.tag }}" \
            --revision-suffix "${{ needs.resolve-metadata.outputs.revision_suffix }}" \
            --min-replicas 0 --max-replicas 5 

      - name: Show deployed revision
        run: |
          az containerapp revision list \
            --name "${{ vars.CONTAINERAPP_NAME }}" \
            --resource-group "${{ vars.RESOURCE_GROUP }}" \
            --query "[0].{revision:name, active:properties.active, image:properties.template.containers[0].image}" \
            -o table
