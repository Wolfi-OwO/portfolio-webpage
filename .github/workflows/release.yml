name: Release Deploy

# Publishing a GitHub Release builds the client, pushes both images (web,
# jobs) to the private Azure Container Registry, then SSHes into the Oracle
# Cloud Always Free VM to pull and recreate the stack — see
# docs/DEPLOYMENT_ORACLE_0EUR.md §9 for the architecture this automates and
# §14 for the GitHub secrets this workflow needs.
#
# The stack moved off Azure Container Apps (see §13 of that doc); this
# workflow no longer deploys there. There is exactly one deploy target now —
# the Oracle VM — so there is exactly one deploy job. Two live deploy paths
# for the same app is how you get them racing each other.
#
# Jobs are split so the parts that don't need VM/registry credentials
# (metadata resolution, client build) can run freely. The two ACR pushes use
# scoped registry tokens (push-only), not an Azure AD identity — no OIDC
# needed anywhere in this file. The final SSH rollout is its own job behind
# the `production` environment, so a release only ever waits on a single
# reviewer approval.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to build and deploy (defaults to the git ref name)'
        required: false

permissions:
  contents: write # sync-version commits the bumped package.json files back

jobs:
  resolve-metadata:
    name: Resolve image metadata
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      image: ${{ steps.meta.outputs.image }}
      image_jobs: ${{ steps.meta.outputs.image_jobs }}
      build_date: ${{ steps.meta.outputs.build_date }}
    steps:
      - name: Compute tag, image names & build date
        id: meta
        run: |
          TAG="${{ github.event.inputs.tag || github.event.release.tag_name || github.ref_name }}"
          if [ -z "$TAG" ]; then
            echo "::error::Could not resolve an image tag from the triggering event."
            exit 1
          fi
          IMAGE="${{ vars.ACR_NAME }}.azurecr.io/${{ vars.IMAGE_NAME }}"
          # docker-compose.prod.yaml hardcodes this repository name (only
          # ACR_SERVER is configurable there) — match it rather than adding a
          # second repo variable for a name that never changes.
          IMAGE_JOBS="${{ vars.ACR_NAME }}.azurecr.io/portfolio-jobs"

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "image_jobs=${IMAGE_JOBS}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "Resolved ${IMAGE}:${TAG} / ${IMAGE_JOBS}:${TAG}"

  sync-version:
    name: Sync package versions to the tag
    runs-on: ubuntu-latest
    needs: resolve-metadata
    steps:
      - uses: actions/checkout@v7
        with:
          # The release tag points at a commit, not a branch. Check out the branch
          # so the version bump has somewhere to land.
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: application/package-lock.json

      # The git tag is the single source of truth for "which version is this?".
      # Rather than bumping four package.json files by hand (and forgetting one),
      # the tag is stamped into all of them, lockfiles included.
      - name: Stamp the version into every package.json
        working-directory: application
        run: npm run version:sync -- "${{ needs.resolve-metadata.outputs.tag }}"

      # Authored as the repo owner, not github-actions[bot]. The bump is a
      # mechanical consequence of a release *he* published, and attributing it to
      # a bot puts github-actions[bot] in the repository's contributor list for
      # what is really his commit. The noreply address is the one GitHub issues
      # for this account, so the commit still links to it without exposing a
      # private email.
      - name: Commit the bump
        run: |
          if git diff --quiet; then
            echo "Versions already match ${{ needs.resolve-metadata.outputs.tag }} — nothing to commit."
            exit 0
          fi
          git config user.name "Wolfi-OwO"
          git config user.email "121342560+Wolfi-OwO@users.noreply.github.com"
          git add application/package.json application/*/package.json application/package-lock.json application/jobs/package-lock.json
          git commit -m "chore(release): set version to ${{ needs.resolve-metadata.outputs.tag }}"
          git push

  build-client:
    name: Build client bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: application/package-lock.json

      - name: Build client bundle
        working-directory: application
        run: |
          npm ci
          npm run build

      - name: Upload client bundle
        uses: actions/upload-artifact@v7
        with:
          name: client-dist
          path: application/client/dist
          retention-days: 1

  push-image:
    name: Push image to ACR
    runs-on: ubuntu-latest
    needs: [resolve-metadata, build-client]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: application/package-lock.json

      # sync-version pushes its bump to the default branch, but this job builds
      # from the *tag*, whose tree was written before that commit existed — so the
      # tag still carries the previous version. Stamp it again here, into the build
      # context only (never committed), so the package.json baked into the image
      # agrees with the tag the image is published under. Without this the image's
      # own metadata reports the previous release.
      - name: Stamp the version into the build context
        working-directory: application
        run: npm run version:sync -- "${{ needs.resolve-metadata.outputs.tag }}"

      - name: Download client bundle
        uses: actions/download-artifact@v8
        with:
          name: client-dist
          path: application/client/dist

      # Scoped ACR token (push/pull only, revocable) — no Azure AD identity
      # or OIDC login needed for this job.
      - name: Log in to ACR
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.ACR_NAME }}.azurecr.io
          username: ${{ secrets.ACR_PUSH_USERNAME }}
          password: ${{ secrets.ACR_PUSH_PASSWORD }}

      # QEMU + a multi-platform Buildx build: the Oracle VM is Ampere (arm64),
      # this runner is amd64. Without this the pushed manifest is amd64-only
      # and `docker compose pull` on the VM fails with "no matching manifest
      # for linux/arm64" (see docs/DEPLOYMENT_ORACLE_0EUR.md §9.1).
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: application
          file: application/dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          # Push a plain multi-platform image manifest, no attestations.
          #
          # By default Buildx attaches provenance/SBOM attestations, which turns
          # the push into an index whose children (the real payload and the
          # attestations) carry no tags of their own. An ACR cleanup that deletes
          # "untagged" manifests then reaps those children while leaving the
          # tagged index behind — the tag still resolves, but every pull fails
          # with MANIFEST_UNKNOWN. That is what took production down and it
          # destroyed every tag in the repository, so there was nothing to roll
          # back to. The platform index itself is still required for multi-arch
          # (that part is unavoidable); it is the attestation children that get
          # dropped.
          provenance: false
          sbom: false
          tags: |
            ${{ needs.resolve-metadata.outputs.image }}:${{ needs.resolve-metadata.outputs.tag }}
            ${{ needs.resolve-metadata.outputs.image }}:latest
          build-args: |
            APP_VERSION=${{ needs.resolve-metadata.outputs.tag }}
            BUILD_DATE=${{ needs.resolve-metadata.outputs.build_date }}
            VCS_REF=${{ github.sha }}
            APP_SOURCE=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  push-jobs-image:
    name: Push jobs image to ACR
    runs-on: ubuntu-latest
    needs: resolve-metadata
    steps:
      - uses: actions/checkout@v7

      # Scoped ACR token (push/pull only, revocable) — no Azure AD identity
      # or OIDC login needed for this job.
      - name: Log in to ACR
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.ACR_NAME }}.azurecr.io
          username: ${{ secrets.ACR_PUSH_USERNAME }}
          password: ${{ secrets.ACR_PUSH_PASSWORD }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push jobs image
        uses: docker/build-push-action@v7
        with:
          context: application/jobs
          file: application/jobs/dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          # Same reasoning as push-image: a plain manifest list, no attestation
          # children an ACR cleanup could orphan.
          provenance: false
          sbom: false
          tags: |
            ${{ needs.resolve-metadata.outputs.image_jobs }}:${{ needs.resolve-metadata.outputs.tag }}
            ${{ needs.resolve-metadata.outputs.image_jobs }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-vps:
    name: Deploy to the Contabo VPS
    runs-on: ubuntu-latest
    # NOT push-jobs-image: that job has failed since 2026-09-05 (the
    # `mcr.microsoft.com/azure-functions/node:4-node22` base image no
    # longer resolves for one of its two platforms) and, per
    # docker-compose.prod.yaml's own comment, has never once pushed a
    # working `portfolio-jobs` image under any name. `jobs` already runs
    # behind `profiles: [jobs]` on the VPS specifically because of this —
    # gating the one deploy that DOES work (web) on a build that has never
    # worked would mean every release silently stops shipping the moment
    # deploy.yml itself gets fixed, which is exactly what happened here.
    needs: [resolve-metadata, push-image]
    environment: production
    steps:
      # The stack moved off the Oracle Cloud VM to the shared Contabo VPS
      # (docs/MIGRATION_CONTABO.md) on 2026-09-05, but this job kept
      # deploying to ORACLE_VM_* secrets that no longer exist in this repo —
      # every release since would have failed here even though push-image
      # succeeded. Same forced-command pattern as netviz's and preussen's
      # deploy.sh (see those repos' deploy.yml): the CI key can only ever
      # run /opt/portfolio/deploy.sh, never an arbitrary command, even
      # though the `deploy` account itself has passwordless sudo.
      #
      # Host-key pinning, not TOFU: an `ssh-keyscan` at deploy time or
      # StrictHostKeyChecking=no would accept whatever key answers on the
      # wire, which is exactly the MITM a public runner is exposed to.
      # DEPLOY_KNOWN_HOSTS was captured once, by hand, from a session
      # already authenticated to the VPS.
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # The image tag is passed as the "ssh command" and read back inside
      # deploy.sh via $SSH_ORIGINAL_COMMAND — sshd's own mechanism for
      # forced-command scripts to still take an argument. No registry
      # credentials are needed here: `docker login` on the VPS already has
      # a cached credential for globalcr01.azurecr.io from the first manual
      # deploy, so deploy.sh only pulls and restarts `web` (the only
      # service this release's image actually changes — `jobs` stays
      # disabled behind `profiles: [jobs]`, see docker-compose.prod.yaml).
      - name: Pull image and restart web on the VPS
        run: |
          ssh -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts -o StrictHostKeyChecking=yes \
            "${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}" "${{ needs.resolve-metadata.outputs.tag }}"

      - name: Summary
        if: success()
        run: |
          {
            echo "### Deployed to production"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Tag | \`${{ needs.resolve-metadata.outputs.tag }}\` |"
            echo "| Host | \`${{ vars.DEPLOY_HOST }}\` (compose service: web) |"
          } >> "$GITHUB_STEP_SUMMARY"
