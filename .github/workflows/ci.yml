name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: application

    services:
      mongodb:
        image: mongo:7
        ports:
          - 50000:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: application/package-lock.json

      - run: npm ci

      - name: Run tests
        run: npm test --workspace @portfolio/server

  build:
    name: Build (client)
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: application

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: application/package-lock.json

      - run: npm ci

      - name: Build client bundle
        run: npm run build

      - name: Upload client bundle
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: application/client/dist
          retention-days: 7

  package:
    name: Package (docker image)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Download client bundle
        uses: actions/download-artifact@v4
        with:
          name: client-dist
          path: application/client/dist

      - name: Compute build metadata
        id: meta
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: application
          file: application/dockerfile
          push: false
          load: true
          tags: portfolio-webpage:ci-${{ github.sha }}
          build-args: |
            VERSION=ci-${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.date }}
            VCS_REF=${{ github.sha }}
            VCS_URL=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
