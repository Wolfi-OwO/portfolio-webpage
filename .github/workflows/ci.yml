name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    services:
      mongodb:
        image: mongo:7
        ports:
          - 50000:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - name: Run tests
        run: npm test

  build:
    name: Build (client)
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: app/client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/client/package-lock.json

      - run: npm ci

      - name: Build client bundle
        run: npm run build

      - name: Upload client bundle
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: app/client/dist
          retention-days: 7

  package:
    name: Package (docker image)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Download client bundle
        uses: actions/download-artifact@v4
        with:
          name: client-dist
          path: app/client/dist

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: app
          file: app/dockerfile
          push: false
          load: true
          tags: portfolio-webpage:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
