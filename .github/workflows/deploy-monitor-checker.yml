name: Deploy Monitor Checker

# Manual/break-glass only. The Oracle VM's `jobs` container (built and
# deployed by release.yml, see docs/DEPLOYMENT_ORACLE_0EUR.md §14) is now the
# sole owner of these timer triggers — it runs the exact same
# application/jobs source against the same Atlas database. This Function App
# is not retired outright (it still exists in Azure and this workflow can
# still push to it on demand), but it must never auto-deploy again: an
# automatic push here would race the VM's checker against a second live copy
# of the same monitor/status-check timers on a schedule, and "one owner per
# job" means that race is not allowed to exist. Hence workflow_dispatch only
# — no `push:` trigger, and the Dependabot-author guard that trigger needed
# is gone with it.
#
# Uses the same GitHub Actions OIDC identity (gh-portfolio-deploy) as before,
# with its own narrowly scoped role assignment (Website Contributor on just
# this Function App, not the whole resource group). Declares the
# `production` environment because that's where AZURE_CLIENT_ID lives
# (AZURE_TENANT_ID/AZURE_SUBSCRIPTION_ID are repo-level). That environment
# now has a required-reviewer approval, so a run waits until the owner
# approves it.
#
# Verify after every run — a green run does not prove the app works. On
# 2026-09-20 a green deploy left the app with zero functions: package.json
# `main` was `src/functions/*.js`, which also matched the *.test.js files; one
# of them imports `pg` (a devDependency, absent after `npm ci --omit=dev`), so
# indexing failed for the whole app and the timers silently stopped. `main`
# now excludes tests. Check that this is non-empty:
#   az functionapp function list -g portfolio-webpage-rg -n woofi-monitor-checker -o table
# and that a new monitorchecks document arrives within ~2 minutes.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy to Azure Functions
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: application/jobs/package-lock.json

      # `jobs` sits outside the npm workspace on purpose: the Functions action
      # zips this folder, node_modules included, so its dependencies have to live
      # here rather than hoisted to application/.
      - name: Install dependencies
        working-directory: application/jobs
        run: npm ci --omit=dev

      - name: Azure Login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: woofi-monitor-checker
          package: application/jobs

      # A green deploy does not prove the app registered its functions (see the
      # 2026-09-20 note above), so assert it. Azure indexes a fresh package
      # asynchronously; wait briefly before the first look. If the list is
      # still empty, one restart recovered it once, so try that before failing.
      - name: Assert the Function App registered its functions
        run: |
          list_functions() {
            az functionapp function list -g portfolio-webpage-rg -n woofi-monitor-checker --query 'length(@)' -o tsv
          }
          sleep 30
          count=$(list_functions)
          if [ "${count:-0}" -eq 0 ]; then
            echo "::warning::Function list is empty after deploy; restarting once."
            az functionapp restart -g portfolio-webpage-rg -n woofi-monitor-checker
            sleep 90
            count=$(list_functions)
          fi
          if [ "${count:-0}" -eq 0 ]; then
            echo "::error::woofi-monitor-checker has zero registered functions after deploy and one restart."
            exit 1
          fi
          echo "Registered functions: ${count}"
          az functionapp function list -g portfolio-webpage-rg -n woofi-monitor-checker -o table
