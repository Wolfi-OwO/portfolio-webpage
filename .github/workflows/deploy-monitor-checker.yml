name: Deploy Monitor Checker

# Deploys the standalone Azure Function (Timer Trigger) that pings monitored
# URLs for the status page. Independent of the main app's release process —
# this only redeploys when monitor-checker/ itself changes.
#
# Uses the same GitHub Actions OIDC identity (gh-portfolio-deploy) as the
# Container App release, with its own narrowly scoped role assignment
# (Website Contributor on just this Function App, not the whole resource
# group). Declares the `production` environment because that's where
# AZURE_CLIENT_ID lives (AZURE_TENANT_ID/AZURE_SUBSCRIPTION_ID are repo-level)
# — as of this writing that environment has no protection rules, so this
# doesn't add an approval gate to these deploys.

on:
  push:
    branches: [main]
    paths:
      - 'application/jobs/**'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy to Azure Functions
    runs-on: ubuntu-latest
    environment: production

    # Dependabot watches npm under /application/*, which includes
    # application/jobs — so a routine lockfile bump lands on main, matches the
    # paths filter above, and rolls production forward with nobody watching.
    #
    # The actor is NOT the lever here. On a squash merge github.actor is
    # whoever pressed the button, not Dependabot, so the usual
    # `github.actor != 'dependabot[bot]'` guard would silently never fire on a
    # push event. The squashed commit keeps Dependabot as its *author*, which
    # is what this reads.
    #
    # The cost, stated plainly: a bump merged here does not reach production
    # until some later change to application/jobs/** deploys it, or someone
    # runs this workflow by hand. That is the point — but it means a security
    # patch sits undeployed too, so workflow_dispatch is deliberately exempt.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.head_commit.author.name != 'dependabot[bot]'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: application/jobs/package-lock.json

      # `jobs` sits outside the npm workspace on purpose: the Functions action
      # zips this folder, node_modules included, so its dependencies have to live
      # here rather than hoisted to application/.
      - name: Install dependencies
        working-directory: application/jobs
        run: npm ci --omit=dev

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: woofi-monitor-checker
          package: application/jobs
