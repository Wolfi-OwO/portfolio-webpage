name: Deploy Monitor Checker

# Deploys the standalone Azure Function (Timer Trigger) that pings monitored
# URLs for the status page. Independent of the main app's release process —
# this only redeploys when monitor-checker/ itself changes.
#
# Uses the same GitHub Actions OIDC identity (gh-portfolio-deploy) as the
# Container App release, with its own narrowly scoped role assignment
# (Website Contributor on just this Function App, not the whole resource
# group). Declares the `production` environment because that's where
# AZURE_CLIENT_ID lives (AZURE_TENANT_ID/AZURE_SUBSCRIPTION_ID are repo-level)
# — as of this writing that environment has no protection rules, so this
# doesn't add an approval gate to these deploys.

on:
  push:
    branches: [main]
    paths:
      - 'application/monitor-checker/**'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # required for Azure OIDC login

jobs:
  deploy:
    name: Deploy to Azure Functions
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: application/monitor-checker/package-lock.json

      - name: Install production dependencies
        working-directory: application/monitor-checker
        run: npm ci --omit=dev

      - name: Zip package
        working-directory: application/monitor-checker
        run: zip -rq ../../monitor-checker.zip . -x ".git*"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Functions
        run: |
          az functionapp deployment source config-zip \
            --resource-group portfolio-webpage-rg \
            --name woofi-monitor-checker \
            --src monitor-checker.zip
