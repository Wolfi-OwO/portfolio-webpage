name: Deploy Monitor Checker

# Deploys the standalone Azure Function (Timer Trigger) that pings monitored
# URLs for the status page. Independent of the main app's release process —
# this only redeploys when monitor-checker/ itself changes.

on:
  push:
    branches: [main]
    paths:
      - 'application/monitor-checker/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Azure Functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: application/monitor-checker/package-lock.json

      - name: Install production dependencies
        working-directory: application/monitor-checker
        run: npm ci --omit=dev

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: woofi-monitor-checker
          package: application/monitor-checker
          publish-profile: ${{ secrets.AZURE_MONITOR_CHECKER_PUBLISH_PROFILE }}
