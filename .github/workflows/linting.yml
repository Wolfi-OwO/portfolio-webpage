name: Project Linting

permissions:
  contents: read
  security-events: write

on:
  push:

jobs:
  lint:
    name: Lint (backend)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: application

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - run: npm run lint

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: application/results.sarif

  lint-client:
    name: Lint (client)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: application/client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - run: npm run lint
