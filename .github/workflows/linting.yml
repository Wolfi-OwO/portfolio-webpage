name: Lint & Format

permissions:
  contents: read
  security-events: write

on:
  push:
  pull_request:

jobs:
  # The three packages used to have three near-identical jobs. They share one
  # workspace now, so one install covers server and client; `jobs` is installed
  # separately because it deliberately sits outside the workspace (see its
  # package.json for why).
  lint:
    name: Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: application

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: application/package-lock.json

      - name: Install (workspace + jobs)
        run: |
          npm ci
          npm ci --prefix jobs

      - name: Lint every package
        run: npm run lint

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4.37.3
        with:
          sarif_file: application/server/results.sarif

  format:
    name: Format
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: application

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: application/package-lock.json

      - run: npm ci

      # Fails the build on unformatted code, so the formatter is a rule rather
      # than a suggestion. Fix locally with `npm run format`.
      - name: Check formatting
        run: npm run format:check
